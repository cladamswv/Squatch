name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build game
        run: npm run build

      - name: Create Capacitor Android project
        run: |
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Squatch-Crossing-debug.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Squatch-Crossing-Android
          path: artifacts/Squatch-Crossing-debug.apk
          if-no-files-found: error
